[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-setup-cli"
version = "1.0.0"
description = "Production-grade Nginx + SSL + Firewall Automation CLI for FastAPI and Backend Services."
readme = "README.md"
authors = [
    { name = "Senior DevOps Architect", email = "devops@example.com" }
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "distro>=1.9.0"
]

[project.scripts]
nginx-cli = "cli.main:main"
nginx-setup = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "models*", "utils*", "templates*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
